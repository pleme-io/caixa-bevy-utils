"[package]\nname = \"bevy_utils\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"A collection of utils for Bevy Engine\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\"]\n\n[features]\ndefault = [\"parallel\", \"buffered_channel\"]\n\n# Provides access to the `Parallel` type.\nparallel = [\"bevy_platform/std\", \"dep:thread_local\"]\n\nbuffered_channel = [\"bevy_platform/std\", \"dep:async-channel\"]\n\nstd = [\"disqualified/alloc\"]\n\ndebug = [\"bevy_platform/alloc\"]\n\n[dependencies]\nbevy_platform = { path = \"../bevy_platform\", version = \"0.19.0-dev\", default-features = false }\n\ndisqualified = { version = \"1.0\", default-features = false }\nthread_local = { version = \"1.0\", optional = true }\nasync-channel = { version = \"2.3.0\", optional = true }\nindexmap = { version = \"2\", default-features = false }\n\n[dev-dependencies]\nstatic_assertions = \"1.1.0\"\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\n"
